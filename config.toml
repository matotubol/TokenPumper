# Token roster (cache/tokens.json) controls what gets minted. With
# token_debug = true we always launch the last roster entry (Testnet Taco
# in the shipped roster) and never flip its is_used — handy for repeated
# dry runs. With token_debug = false we walk top-to-bottom for the first
# is_used == false entry, excluding the final slot so the debug sentinel
# stays reusable. Image is sourced from `assets/{Symbol}.png`.
token_debug = true

# Creator (dev wallet) tx parameters — these apply ONLY to the dev's
# launch tx (create_v2 + buy + ATA + tip) and dev sell-all tx. Each
# `[[accounts]]` entry below has its OWN `cu_price_lamports` for its buy.
# Buy size is in lamports (0.1 SOL = 100_000_000). cu_limit ~210k covers
# create_v2 + dev buy + ATA idempotent; sell-only is much smaller and
# uses cu_sell_limit. Priority fees in micro-lamports per CU — tune the
# buy/sell sides independently for landing probability.
buy_sol_lamports = 1000000000
cu_limit = 250000
creator_cu_buy_price_lamports = 100000
creator_cu_sell_price_lamports = 100000

# Global CU limits for "normal" (non-create_v2) txs. cu_sell_limit
# applies to the dev sell-all (4 ixs); cu_buy_limit is reserved for
# per-account buy txs.
cu_buy_limit = 95000
cu_sell_limit = 95000

# node1 QUIC submitter. node1_api_key is a 36-char UUID — leave it
# unset (or run with debug=true) to skip the QUIC connection. Tip is
# baked into the launch tx as a final System::Transfer ix; node1's
# minimum is 0.001 SOL = 1_000_000 lamports, higher = better landing.
